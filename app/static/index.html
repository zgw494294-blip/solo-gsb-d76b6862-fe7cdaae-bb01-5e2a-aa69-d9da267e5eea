<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>舞台提示执行台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎭 舞台提示执行台</h1>
    <span id="version-badge" title="状态版本号">v0</span>
  </header>

  <div id="toast" role="status"></div>

  <!-- 开场前设置 -->
  <section id="setup-view" class="hidden">
    <h2>开场前设置</h2>
    <p class="hint">按发出顺序录入 <b>2～12</b> 条提示，每条需有<b>唯一编号</b>和<b>非空内容</b>。</p>
    <div id="cue-rows"></div>
    <div class="actions">
      <button id="add-row">＋ 添加一条</button>
      <button id="start-show" class="primary">开始演出 ▶</button>
    </div>
  </section>

  <!-- 演出中 -->
  <section id="live-view" class="hidden">
    <div id="done-banner" class="hidden">✅ 全部提示已发出，本场提示执行完毕！</div>

    <div class="topbar">
      <span id="progress"></span>
      <span class="topbar-ops">
        <button id="archive-show-btn">归档本场 📦</button>
        <button id="reset-btn" class="danger-outline">重新开始</button>
      </span>
    </div>

    <div id="archive-bar" class="card hidden">
      <div class="card-label">归档本场</div>
      <p class="hint">为本场输入一个<b>非空场次名称</b>，系统将保存已发记录快照与尚未发出的提示，随后清空当前台并回到开场前。</p>
      <div class="archive-bar-row">
        <input id="archive-name" maxlength="80" placeholder="场次名称，例如：2026 国庆场·第一幕" aria-label="场次名称">
        <button id="archive-save-btn" class="primary">保存档案并收场</button>
        <button id="archive-cancel-btn">取消</button>
      </div>
    </div>

    <div class="columns">
      <div class="col-main">
        <div id="current-card" class="card"></div>
        <div id="next-card" class="card muted"></div>

        <h3>待发出 <span class="hint-inline">（可改写、可重排）</span></h3>
        <ul id="pending-list" class="cue-list"></ul>
      </div>

      <div class="col-side">
        <h3>已发记录</h3>
        <ul id="issued-list" class="cue-list"></ul>
      </div>
    </div>
  </section>

  <!-- 历史档案（归档后，下一场可回看） -->
  <section id="archives-view">
    <div class="archives-head">
      <h2>📦 档案</h2>
      <button id="archives-refresh">刷新</button>
    </div>
    <div id="archive-list"></div>
    <div id="archive-detail" class="hidden"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
